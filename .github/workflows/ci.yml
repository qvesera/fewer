name: CI

on:
  pull_request:
    branches: [main, dev, release/prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: python3 scripts/decisions.py validate
      - run: python3 scripts/tasks.py validate

  # Task-tracking gate: every commit names a tracked task, and that task is in
  # review/done with recorded time. Full history so the base..HEAD range exists.
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ledger is canonical and internally consistent
        run: python3 scripts/tasks.py validate
      - name: Every commit names a tracked task in review/done
        run: python3 scripts/tasks.py validate-commits --base origin/${{ github.base_ref }}
      # `validate` reads ONE ledger file, so it cannot see what a MERGE would do to
      # it: a branch cut before the base moved mints ids the base already used
      # (two different rows, one id) and its stale copy silently reverts rows the
      # base has moved on. Collisions fail; reverts and dropped rows warn.
      - name: Merging the base keeps the ledger sane (id collisions, reverts)
        run: python3 scripts/tasks.py validate-merge --base origin/${{ github.base_ref }}
      # The engine's own harness. It was a local-only obligation ("run selftest
      # after changing this file"), which is why a regression in the readiness
      # gate or the body splice could merge green. Pure python, no gh, ~1s.
      - name: Ledger engine selftest
        run: python3 scripts/tasks.py selftest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Desktop static export (T-092). `out/` is the shell's only artifact, and it
  # must build with NO Supabase env (CI has none) — docs/blog then render from
  # the repo markdown instead of `content_pages`. Also asserts the build script
  # restored the server-only trees it moves aside for the export.
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - name: Export sanity (app shell + offline docs/blog)
        run: |
          test -f out/index.html
          test -f out/app.html
          test -f out/404.html
          test -f out/docs/shortcuts.html
          test -f out/blog/v060-release.html
      - name: Server-only trees are back after the export
        run: |
          test -f middleware.ts
          test -d src/app/api
          test -f src/app/auth/callback/route.ts

  # Desktop packaging gate (T-097): builds the export + shell, runs the Playwright
  # Electron smoke against the REAL app (xvfb — headless runners have no display),
  # then packages AppImage + deb and uploads them as artifacts. The smoke needs
  # out/ + electron/dist; the package step reuses them (no rebuild).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Cache electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Static export + shell compile
        run: bun run build:desktop && bun run electron:compile
      - name: Electron smoke (Playwright under xvfb)
        run: xvfb-run -a bunx playwright test --config playwright.electron.config.ts
      - name: Package AppImage + deb
        run: bunx electron-builder --linux --publish never
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fewer-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

