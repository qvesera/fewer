name: Open release/prod PR on main update

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open or reuse main -> release/prod PR
        run: |
          existing() {
            gh pr list \
              --base release/prod \
              --head main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          }

          PR=$(existing)
          if [ -n "$PR" ]; then
            echo "PR #$PR already open for main -> release/prod."
            echo "Because the head is 'main', it auto-updates as main advances."
          else
            gh pr create \
              --base release/prod \
              --head main \
              --title "Release: main → release/prod" \
              --body "Automated: \`main\` was updated, so this PR promotes the current \`main\` into \`release/prod\`. Only \`main\` merges into \`release/prod\`."
          fi
        env:
          GH_TOKEN: ${{ github.token }}