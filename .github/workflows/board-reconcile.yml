name: Board Reconcile
# The project board is a PROJECTION of TASKS.yaml: one item per work unit (its
# issue), and Status/Size/Estimate written only by `sync-details`. This job heals
# that projection from the ledger on a schedule, so drift cannot accumulate until
# a human runs a sync by hand — and a no-op pass writes nothing at all.
#
# It deliberately does NOT apply `reconcile`: that moves rows in the ledger, which
# belongs in review like any other change. Its plan is printed for a human.
#
# Triggers: nightly schedule + every merge to dev + every PR against dev, so a
# status change reaches the board with the work instead of waiting for midnight.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [dev]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [dev]

permissions:
  contents: read
  issues: write

# One writer per surface: pr-metadata also projects rows onto the same board.
# Serialize the two so a label/field write cannot interleave with this pass.
concurrency:
  group: task-projections
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Fork PRs don't receive PROJECTS_TOKEN — skip instead of red-Xing a
    # contribution (pr-metadata's board step has the same exposure).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger is integrated on dev. A scheduled run on main would see
          # every issue created from dev as "no ledger row" and go red for a
          # branch that is simply behind.
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'dev' || github.sha }}

      # Labels: ledger -> issue `status:*`. GITHUB_TOKEN can read/write issues.
      - name: Mirror the ledger's status labels onto the issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/tasks.py gh-sync --status-only

      # Board: ledger -> item Status/Size/Estimate. Needs a token with the
      # `project` scope; GITHUB_TOKEN cannot read Projects v2.
      - name: Project the ledger onto the board (the one writer)
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python3 scripts/tasks.py sync-details

      # What reconcile WOULD do, for a human to apply with review. Read-only
      # noise on push/PR events — keep it to the nightly + manual runs.
      - name: Show the reconcile plan (not applied — the ledger is reviewed)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/tasks.py reconcile

      # Fails only when the BOARD projection disagrees with the ledger: that is
      # the surface this job writes, and the next pass can heal it. Ledger drift
      # (a closed issue on a review row) is printed as a NOTE — it needs a
      # reviewed `reconcile --apply` or a human decision, not a red run.
      - name: Report ledger ↔ board drift
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python3 scripts/tasks.py doctor --board --board-only
