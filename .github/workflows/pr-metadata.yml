name: PR Metadata
# Applies the ledger's derived labels, milestone, assignee (and the project
# item when a board number + token are configured) to every PR, so a PR never
# lands bare. Procedure: .agents/skills/pr/SKILL.md — section 0 of
# .clinerules/pr-dev-checks.md requires it before requesting review.
#
# No `branches:` filter on purpose: ci.yml/e2e.yml are scoped to
# main/dev/release/prod, but this job is metadata-only and cheap, so it also
# covers stacked PRs (their base is another feature branch). Verified live:
# it labelled PR #198, which was raised against a stacked base.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job name doubles as the required check context on the dev/main rulesets —
  # it is the "this PR is linked to its task's issue" gate. Renaming it means
  # updating those rulesets (gh api …/rulesets/<id>).
  pr-metadata:
    name: Link issue + metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Labels, milestone, assignee and the issue link, from the task rows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-write: a CI checkout is throwaway, so the `pr:` stamp is skipped.
        # --no-project: this token cannot reach Projects v2; the next step owns the board.
        # --require-link: the merge gate. GitHub only builds the Development link
        # from a closing keyword that is alone on its line, so pr-metadata writes
        # the `Fixes #N` line itself and then refuses to pass if the link did not
        # appear (the manual sidebar link satisfies the check too).
        run: python3 scripts/tasks.py pr-metadata ${{ github.event.pull_request.number }} --no-write --no-project --require-link

      # Project board: needs a PAT with the `project` scope (PROJECTS_TOKEN).
      # `GITHUB_TOKEN` above cannot reach Projects v2 — hence a second step with
      # its own token. PROJECT_NUMBER = 1 lives in scripts/tasks.py, so no flag.
      - name: Add to the project board and sync Status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python3 scripts/tasks.py pr-metadata ${{ github.event.pull_request.number }} --no-write
