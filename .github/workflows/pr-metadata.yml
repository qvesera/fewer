name: PR Metadata
# Applies the ledger's derived labels, milestone, assignee (and the project
# item when a board number + token are configured) to every PR, so a PR never
# lands bare. Procedure: .agents/skills/pr/SKILL.md — section 0 of
# .clinerules/pr-dev-checks.md requires it before requesting review.
#
# No `branches:` filter on purpose: ci.yml/e2e.yml are scoped to
# main/dev/release/prod, but this job is metadata-only and cheap, so it also
# covers stacked PRs (their base is another feature branch). Verified live:
# it labelled PR #198, which was raised against a stacked base.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Labels, milestone and assignee from the task rows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-write: a CI checkout is throwaway, so the `pr:` stamp is skipped
        run: python3 scripts/tasks.py pr-metadata ${{ github.event.pull_request.number }} --no-write

      # Project board: needs a PAT with the `project` scope (PROJECTS_TOKEN).
      # `GITHUB_TOKEN` above cannot reach Projects v2 — hence a second step with
      # its own token. PROJECT_NUMBER = 1 lives in scripts/tasks.py, so no flag.
      - name: Add to the project board and sync Status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python3 scripts/tasks.py pr-metadata ${{ github.event.pull_request.number }} --no-write
