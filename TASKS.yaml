- id: "T-063"
  title: "Rust core + Tauri shell: native archive/metadata layer and local FS integration"
  status: "blocked"
  type: "infra"
  area: "infra"
  tier: 1
  estimate_min: 2400
  estimate_basis: "cli"
  issue: 250
  pr: null
