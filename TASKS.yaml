  created_at: "2026-10-12T11:21:32Z"
  notes: ["2026-10-12T11:22:13Z · adopted at intake from GitHub (open)", "2026-10-12T17:15:45Z · Objective: make canvas groups + tags survive the Export panel's JSON/.fwr round-trip. VERIFIED FACTS: buildJsonExport (exportUtils.ts:149) emits a reduced payload (meta, stats, flattened nodes, id/source/target edges) with NO tags/groups and position ignored on import; exportJSON (:183) + exportFWR (:201) both use it; dispatcher exportGraph (:350) never threads tags/groups in. Import dialog (ImportOriginStep 'json', accept .json,.fwr) -> parseImportFile -> parseJSONGraph (parsers.ts:97) -> chunkTreeToGraph REGENERATES node ids (file-import-<uuid8>) and drops positions/tags/groups, so group membership cannot remap. A FIDELITY path already exists but only for double-click/Open-Recent/drop: openLocalGraph.ts -> parseGraphFile (localLibrary.ts) -> applySnapshot, full SavedGraphData, groups restored; desktop-library .fwr files already round-trip this way. SavedGraphData (savedGraphs.ts:18) = {dataVersion,nodes,edges,tags?,groups?,localRootPath?}, SNAPSHOT_VERSION=2, normalizeSnapshot repairs on load. DESIGN: (1) exportFWR writes a true SavedGraphData snapshot (full nodes incl data, edges, tags, groups, localRootPath) and exportGraph threads tags+groups; keep exportJSON structural for plain .json. (2) route full-snapshot .fwr imports through parseGraphFile+applySnapshot instead of parseJSONGraph; discriminator (tags/groups presence, dataVersion, or format_version bump) so a legacy reduced .fwr still imports structurally. (3) back-compat: do not regress plain .json; detectImportFormat currently classifies snapshots as json; .fwr has two independent writers today. TESTS: round-trip exportFWR->parseGraphFile->applySnapshot restores groups+tags+positions; legacy reduced .fwr still imports; pure discriminator test; e2e export->reimport keeps groups. OUT OF SCOPE: reload cache (T-144/#412 done), cloud/library persistence (works).", "2026-10-12T18:54:47Z · Implemented per the plan as scoped (no backward JSON compatibility). (1) EXPORT: exportFWR writes a true SavedGraphData snapshot via new buildExportSnapshot/buildFwrDocument — cards with data + positions (runtime RF flags pruned), edges, tags, groups (normalized to the exported scope, so an Export-Selected document drops members it did not write), localRootPath; exportGraph threads tags/groups/localRootPath through the existing opts object (ImageExportOptions renamed ExportExtraOptions since it now feeds data formats too). JSON export stays reduced/structural; the branding toggle hides for fwr because a document carries no meta/credit line. (2) IMPORT: runFileImport tries parseGraphDocument first and applies the snapshot whole via applySnapshot (ids, positions, tags, groups, localRootPath restored; import options deliberately ignored — there is no tree to filter), else the existing tree path; parseGraphDocument moved into localLibrary (pure module) and re-exported from openLocalGraph so the importer never pulls nativeShell. (3) NO COMPAT: parseJSONGraph dropped the T-101 envelope unwrap; parseGraphFile now requires snapshot-shaped nodes, so a reduced pre-0.9 .fwr fails loudly (\"Not a Fewer graph\" / missing 'nodes') instead of loading blank cards; isGraphFile is .fwr-only — legacy .json library copies are no longer scanned. (4) DETECTION: detectImportFormat also matches graph.data.nodes, so a .fwr reports json (same return type; fidelity is the action's decision). (5) DIALOG: step 2 swaps the filter panel for a Fewer-graph-document note, step 3 shows a Restores row instead of scan/filter rows. (6) STORE: setGraph clears groups — a whole-graph replace mints a fresh id space, so old membership can never map (applySnapshot re-sets its own groups right after). TESTS: exportUtils document round-trip + scope pruning + detector + no-meta; parsers envelope rejection; localLibrary .json-skip + reduced-.fwr rejection; NEW fileOriginImport.test.ts (document route, structural route, no stale groups after a document-then-structure import, reduced envelope errors) — the implementation moved to fileOriginImport.ts with importActionFile.ts as a one-line re-export because importAction.test.ts mocks that path process-wide and bun's mock.module cannot be un-mocked (afterAll restore verified not to work); groupsSlice setGraph-clears-groups; e2e groups export→re-import keeps the group. ALSO pinned direction:\"TB\" in groupsRelayout.test.ts's beforeEach: a pre-existing order-dependent flake (userSettings.test.ts leaves direction LR on the shared store; bun's file order is not stable — the same flake is documented in the T-146 session note)."]
