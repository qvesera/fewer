- id: "T-039"
  title: "Native shell spike: Tauri vs Swift (compute-heavy workloads need native)"
  status: "backlog"
  type: "research"
  area: "infra"
  tier: null
  estimate_min: 960
  estimate_basis: "cli"
  issue: 214
  pr: null
  internal: false
  milestone: null
  blocked_by: []
  parent: null
  source: null
  time_source: null
  reporter: null
  assignee: "qvesera"
  created_at: "2026-09-25T12:37:16Z"
  notes: ["2026-09-25T12:38:21Z · disk import uses the browser File System Access API today; evaluate Tauri (Rust) vs a Swift native shell for the compute-heavy paths", "2026-09-28T17:45:49Z · RAM evidence gathered 2026-09-28 while designing T-055 (look-inside-archives), answering 'would a Rust core use less RAM for unarchiving?'. Per-path findings on the shipped code: zip = O(central directory) via Blob.slice (only reads 512B head, <=66KB tail, then the CD) - a Blob is disk-backed and already seekable, so a native pread/mmap is NO real win. tar = O(names+sizes) via 512B header walk with arithmetic skip (pos += n, zero bytes read) - already optimal. tar.gz/gz = O(1) RAM (bounded buffer, reads+discards in 64KB chunks) but must inflate EVERY byte (gzip not seekable) and runs on the main thread - Rust gives threads, not less RAM. 7z/rar/xz/bz2/zst via libarchive.js WASM = O(FILE): Archive.open copies the entire archive into the Emscripten MEMFS heap, under a wasm32 ceiling (2-4GB) - the ONE unbounded case, and the one Rust genuinely fixes. THE BIGGEST CONSUMER IS NOT THE ARCHIVE: the graph (per-node path string + edges + derived index from #240) lives in the webview JS heap regardless of core language, and Tauri IPC is JSON by default so a 100k-node tree briefly exists 3x (Rust struct -> JSON -> JS objects). Conclusion for the spike: do NOT port for RAM alone. Port for what ROADMAP already lists (native file watching, tray, global hotkeys) and take bounded-memory archive reads as a bonus. Any real RAM win on the graph side is architectural (compact/paged tree), not a language change, and it helps web + desktop alike. Cannot be benchmarked here: no cargo/rustc/tauri, no pkg-config/gtk3. feats.ts + ROADMAP 'Tauri desktop app: better compute' are already in place; migrate via LOCAL_FS_FEATURES flip and TreeEntry as the unchanged contract."]
  sessions: []
  spent_min: 0
  session_count: 0
