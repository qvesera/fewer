  assignee: "qvesera"
  created_at: "2026-09-28T17:43:34Z"
  notes: ["2026-09-28T17:45:35Z · Documents the SEAM CONSUMER for the archive layer. RAM analysis (2026-09-28, from the T-055 design session): Rust is NOT a blanket win - it fixes one specific unbounded case. Today: zip and tar are already O(entries) not O(file) (zip central directory via Blob.slice; tar header walk with arithmetic skip), and tar.gz is O(1) RAM (bounded buffer, reads+discards 64KB chunks) though it must inflate every byte on the main thread. The one unbounded path is the wasm engine (T-051): Archive.open copies the WHOLE archive into the Emscripten MEMFS heap, O(file) plus a wasm32 ceiling (2-4GB). Rust fixes that via seek + memmap2 (archive_read_open_filename reads through an FD), native libarchive (including zstd, which the wasm build did not declare), rayon for many-archive folders (the T-055 case), and no per-archive worker spawn. What Rust does NOT fix: the graph is the dominant consumer (per-node path strings + edges + the derived index from #240) and it lives in the webview JS heap regardless of core language; Tauri IPC is JSON by default so a 100k-node tree briefly exists 3x (Rust struct -> JSON -> JS objects). The migration's real design constraint is keeping the tree in Rust and paging only what the view draws. SEAM: T-055 defines ArchiveReader = (entry) => Promise<Blob | null> injected per origin; expandArchives never learns where bytes came from, so a native implementation is a drop-in reader and the 64MB engine-format cap T-055 ships can relax in one place. Blocker T-039 decides Rust vs Swift first. HONEST CAVEAT: no cargo/rustc/tauri and no pkg-config/gtk3 on the dev box, so none of this is benchmarked - first step is instrumenting node-count vs bytes-read on the worst real archive."]
