# Supabase CLI configuration. Used for local dev and applying migrations
# to a hosted project via `supabase link` + `supabase db push`.

project_id = "fewer"

[db]
major_version = 15

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

[auth.email]
enable_signup = true
double_confirm_changes = false
# Require email confirmation before a new account can sign in (blocks fake
# sign-ups). The sign-up dialog already prompts "Check your email". Match this
# in the hosted project: Supabase dashboard -> Authentication -> Sign In / Up
# -> Confirm email.
enable_confirmations = true

# Email templates — generated by `bun run email:templates`. Paste the same
# HTML into Dashboard → Auth → Email Templates for the hosted project.

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You've been invited"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your verification code"
content_path = "./supabase/templates/reauthentication.html"
