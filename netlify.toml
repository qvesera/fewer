[build]
  command = "bun run build:netlify"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[functions."watch-digest"]
  schedule = "59 23 * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The interactive app lives at `/app`. Send the app-domain root there so
# visiting app.fewer.directory lands on the app (not the marketing homepage).
[[redirects]]
  from = "/"
  to = "/app"
  status = 302
  [redirects.conditions]
    [redirects.conditions.headers]
      Host = "app.fewer.directory"

[[redirects]]
  from = "/"
  to = "/app"
  status = 302
  [redirects.conditions]
    [redirects.conditions.headers]
      Host = "fewer-directory.netlify.app"

# Redirect the www subdomain to the apex domain (fewer.directory).
# Only takes effect if www.fewer.directory is added as a domain/alias on this site.
[[redirects]]
  from = "/*"
  to = "https://fewer.directory/:splat"
  status = 301
  [redirects.conditions]
    [redirects.conditions.headers]
      Host = "www.fewer.directory"