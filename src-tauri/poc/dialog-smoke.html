<!doctype html>
<html>
<head><meta charset="utf-8" /><title>dialog smoke (T-091)</title></head>
<body>
<h2>Dialog smoke — should pop a folder picker</h2>
<pre id="out"></pre>
<script>
const log = (m) => {
  document.getElementById("out").textContent += m + "\n";
  new Image().src = "/r?" + encodeURIComponent(String(m));
};
log("boot " + new Date().toISOString());
setTimeout(async () => {
  try {
    // Unregistered plugin = process abort here (state() before manage()).
    // Registered = a folder dialog opens and this call waits for the user.
    log("invoking pick_library_dir…");
    const p = await window.__TAURI_INTERNALS__.invoke("pick_library_dir");
    log("resolved: " + JSON.stringify(p));
  } catch (e) {
    log("error (ok if cancelled): " + e);
  }
}, 2500);
</script>
</body>
</html>
