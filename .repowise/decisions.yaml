- id: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
  title: CustomNode menus are pure action descriptors; DOM suites are now permitted
  decision: 'CustomNode''s context-menu actions must be pure action-descriptor builders
    in src/lib/fewer/*.ts (the batchActions.ts pattern), tested with bun,
    so menu logic stays testable without mounting a full component.
    The GraphCanvas ADR''s "no React renderer" rationale is superseded:
    @testing-library/react and happy-dom are now devDependencies and
    tests/components/*.test.tsx suites exist — render a component when a
    DOM characterization suite is the most effective coverage path.'
  reason: 'The 7c1cd6c3 ADR''s premise ("the repo has no dependency for a React
    renderer and will not add") is no longer true: @testing-library/react
    ^16.3.3, happy-dom, and @testing-library/user-event are in
    package.json and six DOM suites exist in tests/components.
- id: b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
  title: Sidebar renders real panels directly; no barrel mock in component suites
  decision: >-
    Sidebar's child panels (StatsPanel, SavedGraphsPanel, TagsPanel) render as
    real components from the barrel import; the barrel must not be mocked in
    component suites. The previous partial barrel mock (3/38 exports) was
    deleted because it broke every barrel-importing test via the process-wide
    mock.module registry. Component suites that need these panels must mock
    their dependencies (supabase, useProfile) individually instead.
  reason: >-
    The barrel mock prevented all future component suites from importing
    barrel-exporting components. The three real modules load cleanly under
    existing spread-override mocks (supabase, useProfile) and no suite
    requires them to be stubbed.
  scope:
  - src/components/fewer/Sidebar.tsx
  - src/components/fewer/GraphCanvas.tsx
  - src/components/fewer/FewerApp.tsx
